<!DOCTYPE html>
<html>
<head>
    <title>Giải Mã Nhị Phân</title>
    <link rel="stylesheet" href="Binary_game.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // BƯỚC 1: BIẾN PHIÊN BẢN (VERSION)
        const CACHE_VERSION = "0.1.1"; 

        // BƯỚC 2: HÀM PHÁ CACHE
        function applyCacheBusting() {
            // Phá Cache cho CSS
            document.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
                link.href = link.href.split('?')[0] + '?v=' + CACHE_VERSION;
            });

            // Phá Cache cho JS
            document.querySelectorAll('script[src]').forEach(script => {
                script.src = script.src.split('?')[0] + '?v=' + CACHE_VERSION;
            });
        }

        // Chạy hàm ngay khi trang tải xong
        window.onload = applyCacheBusting;
    </script>
</head>
<body>
    <div class="game-container">
        <h1>Giải Mã Nhị Phân 💻</h1>
        <div class="info-panel">
            <p>Điểm: <span id="score">0</span></p>
            <p>Thời gian: <span id="time">10</span>s</p>
        </div>
        <div class="binary-display-area">
            <span id="binary-code"></span>
        </div>
        <div class="input-line">
            <input type="text" id="answer-input" placeholder="Nhập vào đây...">
            <span class="cursor"></span>
        </div>
        <div class="message-area">
            <p id="message"></p>
        </div>
    </div>
    <script src="Binary_game.js"></script>
</body>
</html>
